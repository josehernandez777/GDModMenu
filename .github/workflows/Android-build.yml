
name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No se encontró ningún ZIP en la raíz."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::No se encontró settings.gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto encontrado: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -d "$PROJECT_DIR/app" || {
            echo "::error::No existe el módulo app."
            exit 1
          }

          echo "Estructura del proyecto verificada."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            testDebugUnitTest \
            lintDebug \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gd-mod-menu-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            extracted/**/app/build/reports/tests/
            extracted/**/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
